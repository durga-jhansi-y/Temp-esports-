# ─── Datasource (H2 in-memory for dev/test) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:esportsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ─── H2 Console (disable in production) ───────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Server ────────────────────────────────────────────────────────────────
server.port=8080

# ─── JWT Configuration ─────────────────────────────────────────────────────
# SECURITY: Set JWT_SECRET as an environment variable before running.
# This placeholder is ONLY for local development. Replace with a strong
# random secret (256-bit / 32+ character Base64 string) in production.
# Example: export JWT_SECRET=<your-strong-secret-here>
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_DEV_PLACEHOLDER_NOT_FOR_PRODUCTION}

# JWT expiration: 24 hours in milliseconds
app.jwt.expiration=86400000
